# Nginx config for single-project deployment:
# - Serves frontend static bundle from alarm_pred/dist
# - Proxies /api/* to Flask/Gunicorn on 127.0.0.1:5000
#
# Replace YOUR_DOMAIN with your real domain.
# If you use only IP, set server_name to your public IP.

upstream warevents_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Frontend build output
    root /home/ubuntu/war-events-predicting/alarm_pred/dist;
    index index.html;

    # API -> Flask/Gunicorn
    location /api/ {
        proxy_pass http://warevents_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Flask health endpoint pass-through
    location = /health {
        proxy_pass http://warevents_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
